<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img"><title>单个认领申请状态图：待审核、已通过、已驳回</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#172b4d">
<text x="600" y="46" text-anchor="middle" font-size="27">单个认领申请状态图 · 成员 8 提案</text>
<circle cx="600" cy="98" r="10" fill="#172b4d"/>
<rect x="440.0" y="205.0" width="320" height="90" rx="12" fill="#eef5ff" stroke="#345e8c" stroke-width="2"/>
<text x="600" y="243" text-anchor="middle" font-size="20">待审核</text>
<text x="600" y="271" text-anchor="middle" font-size="20">PENDING</text>
<polyline points="600,108 600,205" fill="none" stroke="#334155" stroke-width="2"/>
