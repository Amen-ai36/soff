<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860"><ns0:defs><ns0:marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><ns0:path d="M0,0 L8,4 L0,8" fill="#334155" /></ns0:marker></ns0:defs><ns0:rect width="100%" height="100%" fill="white" /><ns0:text x="700.0" y="40" text-anchor="middle" font-family="Microsoft YaHei" font-size="26" fill="#0f172a">M3-FIG-02 单个认领申请状态图（候选审查预览）</ns0:text><ns0:circle cx="700" cy="95" r="10" fill="#0f172a" /><ns0:rect x="535.0" y="145" width="330" height="82" rx="10" fill="#eef6ff" stroke="#334155" stroke-width="2" /><ns0:text x="700" y="174" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">待审核 PENDING</ns0:text><ns0:text x="700" y="203" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">有效创建，不授予维护权</ns0:text><ns0:polyline points="700,105 700,145" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><ns0:polyline points="700,227 700,270 80,270 80,501 150,501" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><ns0:text x="330" y="335" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">管理员通过</ns0:text><ns0:text x="330" y="364" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">非本人、版本一致、门户空闲</ns0:text><ns0:text x="330" y="393" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">决定、授权、审计原子提交</ns0:text><ns0:polyline points="700,227 700,270 1320,270 1320,501 1250,501" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><ns0:text x="1070" y="335" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">管理员有理由驳回</ns0:text><ns0:text x="1070" y="364" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">非本人、版本一致、理由非空</ns0:text><ns0:text x="1070" y="393" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">决定与审计原子提交</ns0:text><ns0:rect x="150.0" y="460" width="350" height="82" rx="10" fill="#eef6ff" stroke="#334155" stroke-width="2" /><ns0:text x="325" y="489" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">已通过 APPROVED</ns0:text><ns0:text x="325" y="518" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">有效门户授权</ns0:text><ns0:rect x="900.0" y="460" width="350" height="82" rx="10" fill="#eef6ff" stroke="#334155" stroke-width="2" /><ns0:text x="1075" y="489" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">已驳回 REJECTED</ns0:text><ns0:text x="1075" y="518" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">不新增授权</ns0:text><ns0:polyline points="325,542 325,595" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><ns0:circle cx="325" cy="610" r="15" fill="white" stroke="#334155" stroke-width="2" /><ns0:circle cx="325" cy="610" r="9" fill="#334155" /><ns0:polyline points="1075,542 1075,595" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><ns0:circle cx="1075" cy="610" r="15" fill="white" stroke="#334155" stroke-width="2" /><ns0:circle cx="1075" cy="610" r="9" fill="#334155" /><ns0:text x="700" y="690" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">失败或冲突不提交本请求变更，读取最新权威状态。</ns0:text><ns0:text x="700" y="719" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">驳回补充后创建新申请 ID，旧终态不回退。</ns0:text><ns0:text x="700" y="748" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#0f172a">草稿 / 上传是 UI 状态，撤回 / 申诉另行确认。</ns0:text><ns0:text x="700" y="825" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" fill="#0f172a">与 PUML / SPEC 同语义的手工排版预览，非 CodeArts 平台导出</ns0:text><ns0:polygon points="700.0,145.0 704.0,135.0 696.0,135.0" fill="#334155" /><ns0:polygon points="150.0,501.0 140.0,497.0 140.0,505.0" fill="#334155" /><ns0:polygon points="1250.0,501.0 1260.0,505.0 1260.0,497.0" fill="#334155" /><ns0:polygon points="325.0,595.0 329.0,585.0 321.0,585.0" fill="#334155" /><ns0:polygon points="1075.0,595.0 1079.0,585.0 1071.0,585.0" fill="#334155" /></ns0:svg>