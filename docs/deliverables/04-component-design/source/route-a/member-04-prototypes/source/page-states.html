<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成员4页面状态线框图</title>
  <style>
    :root { --ink:#202936; --muted:#687385; --line:#c7ced8; --line-strong:#778397; --paper:#fff; --panel:#f5f7fa; --panel-2:#e9edf3; --accent:#394858; --accent-soft:#e9edf1; --danger:#945a5a; --ok:#567864; --warn:#876d3d; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:1440px; height:1000px; overflow:hidden; }
    body { font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; color:var(--ink); background:#dfe4ea; }
    button,input,select,textarea { font:inherit; color:inherit; }
    .sheet { position:relative; width:1366px; height:920px; margin:40px auto; background:var(--paper); border:1px solid #aeb7c4; box-shadow:0 10px 30px rgba(23,33,48,.12); overflow:hidden; }
    .wire-label { position:fixed; z-index:10; top:13px; right:38px; color:var(--muted); font-size:13px; letter-spacing:.5px; }
    .topbar { height:72px; padding:0 46px; display:flex; align-items:center; border-bottom:1px solid var(--line); background:#fff; }
    .brand { display:flex; align-items:center; gap:12px; min-width:250px; font-weight:700; }
    .brand-mark { width:34px; height:34px; border:2px solid var(--ink); border-radius:7px; position:relative; }
    .brand-mark::before,.brand-mark::after { content:""; position:absolute; left:6px; height:2px; background:var(--ink); }
    .brand-mark::before { width:18px; top:10px; }.brand-mark::after { width:12px; top:18px; }
    .nav { display:flex; align-items:center; gap:36px; height:100%; }.nav span { color:#4d596a; font-size:15px; }
    .nav .active { color:var(--accent); font-weight:700; border-bottom:3px solid var(--accent); height:72px; display:flex; align-items:center; }
    .user-nav { margin-left:auto; display:flex; gap:16px; align-items:center; }.ghost-link { color:var(--accent); font-weight:600; }
    .outline-btn,.primary-btn,.soft-btn,.text-btn { min-height:38px; padding:8px 18px; border-radius:5px; border:1px solid var(--line-strong); background:#fff; font-weight:600; }
    .primary-btn { color:#fff; background:var(--accent); border-color:var(--accent); }.soft-btn { color:var(--accent); background:var(--accent-soft); border-color:#b8cadf; }
    .text-btn { border-color:transparent; background:transparent; color:var(--accent); padding-left:4px; padding-right:4px; }
    .small { font-size:13px; color:var(--muted); }.box { border:1px solid var(--line); border-radius:7px; background:#fff; }.page-note { position:absolute; left:32px; bottom:16px; color:var(--muted); font-size:12px; }
    .context { height:56px; padding:0 46px; display:flex; align-items:center; justify-content:space-between; background:var(--panel); border-bottom:1px solid var(--line); }
    .content { padding:30px 54px; }.title-row { display:flex; align-items:end; justify-content:space-between; margin-bottom:22px; }.title-row h1 { margin:0; font-size:27px; }.title-row p { margin:7px 0 0; color:var(--muted); }
    .two-col { display:grid; grid-template-columns:1fr 330px; gap:26px; }.three-col { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .panel { padding:22px; }.panel h2,.panel h3 { margin:0 0 16px; }.rule { height:1px; background:var(--line); margin:18px 0; }
    .meta-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }.meta { padding:14px; background:var(--panel); border:1px solid #dde2e9; }.meta strong { display:block; margin-top:7px; font-size:17px; }
    .list { display:grid; gap:0; }.list-row { padding:15px 0; border-bottom:1px solid #d9dee5; }.list-row h3 { margin:0 0 7px; font-size:17px; color:var(--accent); }.list-row p { margin:4px 0; color:var(--muted); font-size:13px; }
    .badge { display:inline-block; padding:5px 9px; border:1px solid #9aa5b3; border-radius:999px; color:#536073; font-size:12px; }.badge.ok { color:var(--ok); border-color:#9ab0a1; }.badge.warn { color:var(--warn); border-color:#b9a77c; }
    .filterbar { padding:16px 20px; display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:7px; margin-bottom:20px; }.field { height:38px; padding:8px 12px; border:1px solid #98a3b1; border-radius:5px; background:#fff; min-width:150px; }
    .kpi { padding:18px; background:var(--panel); border:1px solid #dde2e9; border-radius:6px; }.kpi strong { display:block; font-size:26px; margin-top:8px; }.kpi em { font-style:normal; color:var(--muted); font-size:12px; }
    .chart { height:260px; display:flex; align-items:end; gap:28px; padding:22px 28px 0; border:1px solid var(--line); background:#fbfcfd; }.bar-wrap { height:210px; flex:1; display:flex; align-items:center; flex-direction:column; justify-content:end; gap:8px; }.bar { width:72px; background:var(--accent); border-radius:5px 5px 0 0; }.axis { display:flex; justify-content:space-around; padding:8px 25px; color:var(--muted); font-size:12px; }
    .login-layout { width:470px; margin:65px auto; }.login-layout h1 { margin:0 0 8px; font-size:26px; }.login-layout .panel { padding:32px; }.form-row { margin:18px 0; }.form-row label { display:block; margin-bottom:8px; font-weight:700; font-size:14px; }.input,.textarea { width:100%; border:1px solid #98a3b1; border-radius:5px; background:#fff; padding:11px 13px; color:#7b8593; }.textarea { height:94px; resize:none; }.form-actions { display:flex; justify-content:flex-end; gap:12px; padding-top:15px; border-top:1px solid var(--line); }
    .tabs { height:54px; display:flex; gap:28px; align-items:end; border-bottom:1px solid var(--line); }.tabs span { padding:0 5px 14px; }.tabs .active { border-bottom:3px solid var(--accent); font-weight:700; color:var(--accent); }
    .notice { padding:12px 15px; border:1px solid #b9a77c; background:#fbf7e9; color:#68572e; border-radius:5px; }.notice.ok { border-color:#9ab0a1; background:#f1f7f2; color:#43604d; }
    .review-layout { display:grid; grid-template-columns:390px 1fr; height:680px; border:1px solid var(--line); }.review-list { background:#fbfcfd; border-right:1px solid var(--line); padding:20px; }.review-item { padding:15px 0; border-bottom:1px solid #d9dee5; }.review-item.selected { padding-left:12px; border-left:4px solid var(--accent); background:#eef1f5; }.review-detail { padding:25px 30px; }.review-detail .decision { display:flex; gap:10px; margin-top:20px; }
    .task-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }.task-card { padding:18px; border:1px solid var(--line); border-radius:7px; background:#fff; }.task-card strong { display:block; font-size:23px; margin-top:8px; }.timeline { margin:20px 0 0 12px; border-left:2px solid var(--line); padding-left:20px; }.timeline-entry { position:relative; padding-bottom:21px; }.timeline-entry::before { content:""; position:absolute; left:-27px; top:3px; width:12px; height:12px; border:2px solid var(--accent); background:#fff; border-radius:50%; }
  </style>
</head>
<body><main id="app"></main>
<script>
const header=(active="",loggedIn=false)=>`<header class="topbar"><div class="brand"><span class="brand-mark"></span><span>学术成果平台</span></div><nav class="nav"><span class="${active==='works'?'active':''}">成果</span><span class="${active==='scholars'?'active':''}">学者</span><span class="${active==='stats'?'active':''}">统计</span></nav><div class="user-nav"><span class="ghost-link">${loggedIn?'我的认领':'登录'}</span><button class="outline-btn">${loggedIn?'个人中心':'我的'}</button></div></header>`;
const shell=(code,title,content)=>`<section class="sheet"><div class="wire-label">低保真线框图 · ${code} · ${title}</div>${content}<div class="page-note">成员4 · 方案A · 评审稿 v0.3　｜　图中姓名、成果和数字均为模拟示例；字段与状态待团队确认；尚未进行真实用户测试。</div></section>`;
const pages={
detail:shell('UI4-P03','成果详情',`${header('works')}<div class="context"><span>← 返回检索结果</span><span class="small">公开成果 · 数据更新时间 YYYY-MM-DD</span></div><main class="content"><div class="title-row"><div><h1>面向知识增强的大语言模型检索方法研究</h1><p>公开成果详情 · 论文</p></div><span class="badge">来源待核验</span></div><div class="two-col"><div class="box panel"><div class="meta-grid"><div class="meta"><span class="small">发表年份</span><strong>2026</strong></div><div class="meta"><span class="small">成果类型</span><strong>论文</strong></div><div class="meta"><span class="small">公开状态</span><strong>可浏览</strong></div></div><div class="rule"></div><h2>摘要</h2><p class="small" style="line-height:1.9">结合语义检索与知识增强方法，研究学术成果发现中的信息匹配问题……</p><h2 style="margin-top:26px">作者与机构</h2><div class="list"><div class="list-row"><h3>张某</h3><p>示例大学 · 计算机学院 · 研究领域：信息检索</p></div><div class="list-row"><h3>李某</h3><p>示例研究院 · 研究领域未提供</p></div></div></div><aside><div class="box panel"><h3>来源信息</h3><p class="small">来源：示例公开数据集</p><p class="small">原始链接：暂不可访问</p><p class="small">最近更新时间：YYYY-MM-DD HH:MM</p><button class="outline-btn" style="margin-top:12px">提交来源反馈</button></div><div class="box panel" style="margin-top:16px"><h3>关联入口</h3><button class="text-btn">查看作者门户 →</button><button class="text-btn">查看相关成果 →</button></div></aside></div></main>`),
stats:shell('UI4-P05','公开统计',`${header('stats')}<main class="content"><div class="title-row"><div><h1>公开统计</h1><p>基于当前公开版本的可解释统计，不包含受限材料。</p></div><span class="small">数据版本：PUBLIC-2026-11-17</span></div><div class="filterbar"><span class="small">统计范围</span><div class="field">2024–2026　⌄</div><div class="field">全部成果类型　⌄</div><div class="field">全部领域　⌄</div><button class="primary-btn">应用</button></div><div class="task-grid"><div class="kpi"><span class="small">公开成果</span><strong>10,240</strong><em>真实/模拟分列展示</em></div><div class="kpi"><span class="small">学者门户</span><strong>1,286</strong><em>当前公开集合</em></div><div class="kpi"><span class="small">机构</span><strong>74</strong><em>未知值不计入排名</em></div><div class="kpi"><span class="small">领域未知</span><strong>6.4%</strong><em>unknown_count=655</em></div></div><div class="two-col" style="margin-top:22px"><div class="box panel"><h2>年度成果数量</h2><div class="chart"><div class="bar-wrap"><div class="bar" style="height:105px"></div><span class="small">2024</span></div><div class="bar-wrap"><div class="bar" style="height:155px"></div><span class="small">2025</span></div><div class="bar-wrap"><div class="bar" style="height:190px"></div><span class="small">2026</span></div></div><div class="axis"><span>计数口径：公开成果 ID 去重</span><span>更新时间：YYYY-MM-DD</span></div></div><aside class="box panel"><h3>口径说明</h3><p class="small" style="line-height:1.8">真实 0、未知和未提供分别表达。多领域成果按统一统计规则计数，规则版本随响应返回。</p><div class="notice" style="margin-top:18px">图表可用下方数据表复核，图形不是唯一信息来源。</div></aside></div></main>`),
login:shell('UI4-P06','登录',`${header()}<main class="login-layout"><div class="box panel"><h1>登录平台</h1><p class="small">登录后可提交门户认领并查询本人申请。</p><div class="form-row"><label>账号</label><div class="input">请输入账号或邮箱</div></div><div class="form-row"><label>密码</label><div class="input">请输入密码　　　　　　　　　⌁</div></div><div class="notice">登录成功不会自动获得门户维护权，认领申请仍需审核。</div><div class="form-actions" style="margin-top:22px"><button class="text-btn">返回原页面</button><button class="primary-btn">登录</button></div></div><p class="small" style="text-align:center;margin-top:18px">会话过期时只恢复公开目标和非敏感查询条件。</p></main>`),
maintenance:shell('UI4-P09','门户与成果关联维护',`${header('scholars',true)}<div class="context"><span>← 我的门户</span><span class="small">当前授权门户：示例学者姓名 · 版本 v12</span></div><main class="content"><div class="title-row"><div><h1>门户维护</h1><p>仅能修改当前授权门户，不能删除共享成果本体。</p></div><span class="badge ok">已授权</span></div><nav class="tabs"><span class="active">个人公开字段</span><span>成果展示关联</span><span>共享成果纠错</span></nav><div class="two-col" style="margin-top:22px"><div class="box panel"><h2>个人公开字段</h2><div class="form-row"><label>公开简介</label><div class="textarea">研究方向、个人简介和公开联系方式……</div></div><div class="form-row"><label>研究领域</label><div class="input">自然语言处理、知识图谱、信息检索</div></div><div class="form-actions"><button class="outline-btn">放弃修改</button><button class="primary-btn">保存当前版本</button></div></div><aside><div class="notice">当前版本：v12。保存时会再次检查版本，冲突时保留你的草稿。</div><div class="box panel" style="margin-top:16px"><h3>同步状态</h3><p class="small">权威保存：已同步</p><p class="small">公开检索：最近更新 YYYY-MM-DD HH:MM</p><button class="text-btn">查看变更记录 →</button></div></aside></div></main>`),
feedback:shell('UI4-P10','纠错与反馈',`${header('scholars')}<main class="content"><div class="title-row"><div><h1>提交问题反馈</h1><p>反馈只用于治理公开内容，不会公开提交人的私密信息。</p></div></div><div class="two-col"><div class="box panel"><h2>目标对象</h2><div class="meta-grid"><div class="meta"><span class="small">对象类型</span><strong>学者门户</strong></div><div class="meta"><span class="small">对象</span><strong>示例学者姓名</strong></div><div class="meta"><span class="small">标识</span><strong>公开 ID</strong></div></div><div class="form-row"><label>问题类型</label><div class="field" style="width:100%">信息不完整　⌄</div></div><div class="form-row"><label>问题说明</label><div class="textarea">请描述错误、重复、来源失效或不当公开的具体位置……</div></div><div class="form-row"><label>联系方式（可选）</label><div class="input">仅用于处理反馈，不在公开页面展示</div></div><div class="form-actions"><button class="outline-btn">取消</button><button class="primary-btn">提交反馈</button></div></div><aside class="box panel"><h3>隐私说明</h3><p class="small" style="line-height:1.8">证明材料和私有联系方式不进入公开响应、搜索索引、URL 或客户端日志。</p><div class="notice ok" style="margin-top:18px">提交后可凭反馈编号查询处理状态；内部审核备注不会公开。</div></aside></div></main>`),
review:shell('UI4-P11','认领审核工作台',`${header('',true)}<div class="context"><span>管理区 / 认领审核</span><span class="small">当前管理员：示例管理员 · 不能审核本人申请</span></div><main class="content" style="padding-top:22px"><div class="filterbar"><span class="small">申请筛选</span><div class="field">待审核　⌄</div><div class="field">最近提交　⌄</div><button class="primary-btn">应用筛选</button></div><div class="review-layout"><aside class="review-list"><h3>申请列表（12）</h3><div class="review-item selected"><span class="badge warn">待审核</span><h3 style="margin:9px 0 4px;font-size:15px">DEMO-0001</h3><p class="small">示例学者姓名 · 2026-11-17</p></div><div class="review-item"><span class="badge">待审核</span><h3 style="margin:9px 0 4px;font-size:15px">DEMO-0002</h3><p class="small">另一位学者 · 2026-11-16</p></div><div class="review-item"><span class="badge ok">已通过</span><h3 style="margin:9px 0 4px;font-size:15px">DEMO-0003</h3><p class="small">处理完成 · 2026-11-15</p></div></aside><section class="review-detail"><div class="title-row"><div><h1 style="font-size:23px">DEMO-0001</h1><p>目标门户：示例学者姓名 · 申请人公开上下文</p></div><span class="badge warn">待审核</span></div><div class="two-col"><div class="box panel"><h3>申请说明</h3><p class="small" style="line-height:1.8">申请人说明本人身份、与目标门户关系以及可供核验的信息。证明材料入口受控，内部备注不进入公开页面。</p><h3 style="margin-top:22px">审核理由</h3><div class="textarea">通过或驳回前必须填写可公开理由……</div></div><aside class="box panel"><h3>操作确认</h3><p class="small">提交期间会锁定当前申请版本；冲突时刷新权威状态。</p><div class="decision"><button class="primary-btn">通过申请</button><button class="outline-btn">驳回申请</button></div><div class="notice" style="margin-top:18px">通知失败不代表审核决定回滚，页面应显示“决定已保存，通知待处理”。</div></aside></div></section></div></main>`),
tasks:shell('UI4-P12','采集任务概览',`${header('',true)}<div class="context"><span>管理区 / 采集任务</span><span class="small">任务、尝试、批次和发布水位分开显示</span></div><main class="content" style="padding-top:22px"><div class="title-row"><div><h1>采集任务概览</h1><p>页面只展示任务运行反馈，不重新定义数据管道业务状态。</p></div><button class="primary-btn">创建采集任务</button></div><div class="task-grid"><div class="task-card"><span class="small">运行中</span><strong>3</strong><span class="small">当前任务</span></div><div class="task-card"><span class="small">待重试</span><strong>1</strong><span class="small">最近 24 小时</span></div><div class="task-card"><span class="small">待发布批次</span><strong>2</strong><span class="small">需要治理确认</span></div><div class="task-card"><span class="small">最近水位</span><strong>v28</strong><span class="small">公开投影</span></div></div><div class="two-col" style="margin-top:22px"><div class="box panel"><h2>任务列表</h2><div class="list"><div class="list-row"><h3>OpenAlex 增量采集 <span class="badge ok">运行中</span></h3><p>尝试 #4 · 批次 2026-11-17-03 · 已处理 8,420 条</p></div><div class="list-row"><h3>DBLP 公开来源同步 <span class="badge warn">待重试</span></h3><p>尝试 #2 · 依赖限流 · 下次重试时间待调度器返回</p></div><div class="list-row"><h3>课程模拟数据导入 <span class="badge">已停止</span></h3><p>最后发布水位 v27 · 原因：管理员停止</p></div></div></div><aside class="box panel"><h3>当前任务时间线</h3><div class="timeline"><div class="timeline-entry"><strong>读取来源</strong><div class="small">完成 · 08:40</div></div><div class="timeline-entry"><strong>清洗与消歧</strong><div class="small">进行中 · 08:42</div></div><div class="timeline-entry"><strong>公开投影</strong><div class="small">等待质量门禁</div></div></div></aside></div></main>`)
};
const key=new URLSearchParams(location.search).get('page')||'detail'; document.getElementById('app').innerHTML=pages[key]||pages.detail;
</script></body></html>
